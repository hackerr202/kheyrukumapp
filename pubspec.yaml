name: kheyrukummobileapp
description: "A modern, animated parent-teacher communication portal for Quranic education."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  record: ^5.2.1
  audioplayers: ^6.1.2
  path_provider: ^2.1.5
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

