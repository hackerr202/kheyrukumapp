name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate clean modern Android v2 scaffolding
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.kheyrukum.portal
          
          # Add system notification permissions for off-app push alerts
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>' android/app/src/main/AndroidManifest.xml

          # Configure root build.gradle to provide fallback compileSdkVersion for all subprojects and plugins
          cat << 'EOF' >> android/build.gradle
          allprojects {
              ext {
                  compileSdkVersion = 34
                  minSdkVersion = 21
                  targetSdkVersion = 34
                  flutter = [
                      compileSdkVersion: 34,
                      minSdkVersion: 21,
                      targetSdkVersion: 34
                  ]
              }
          }
          subprojects {
              project.ext {
                  set("flutter", [
                      compileSdkVersion: 34,
                      minSdkVersion: 21,
                      targetSdkVersion: 34
                  ])
              }
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                          compileSdkVersion 34
                          buildToolsVersion "34.0.0"
                      }
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugins in pub-cache for Gradle compatibility
        run: |
          PUB_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "Scanning and patching plugin build.gradle files in $PUB_DIR..."
          find "$PUB_DIR" -type f -name "build.gradle" -exec sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 34/g' {} + || true
          find "$PUB_DIR" -type f -name "build.gradle" -exec sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 34/g' {} + || true

      - name: Build Release APK
        run: |
          # Build universal APK and split-per-abi for maximum device compatibility
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kheyrukum-apk
          path: build/app/outputs/flutter-apk/*.apk
