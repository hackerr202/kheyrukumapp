name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate clean modern Android scaffolding
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.kheyrukum.portal
          
          # Add system notification and internet permissions for background push alerts
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>' android/app/src/main/AndroidManifest.xml

          # Force AndroidX dependencies to compileSdk 34 compatible versions
          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'androidx.browser:browser:1.8.0'
                      force 'androidx.core:core:1.13.1'
                      force 'androidx.core:core-ktx:1.13.1'
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugins in pub-cache for Gradle compatibility
        run: |
          PUB_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "Scanning and patching plugin build.gradle files in $PUB_DIR..."
          find "$PUB_DIR" -type f -name "build.gradle" -exec sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 34/g' {} + || true
          find "$PUB_DIR" -type f -name "build.gradle" -exec sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 34/g' {} + || true
          find "$PUB_DIR" -type f -name "build.gradle.kts" -exec sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 34/g' {} + || true

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..
          mkdir -p build/app/outputs/flutter-apk
          find android/ -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/ \;
          echo "=== Built APK Artifacts ==="
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kheyrukum-apk
          path: build/app/outputs/flutter-apk/*.apk
