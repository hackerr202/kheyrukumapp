name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate clean modern Android scaffolding
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.kheyrukum.portal
          
          # Add system notification and internet permissions for background push alerts
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>' android/app/src/main/AndroidManifest.xml

          # Disable AarMetadata check tasks and align compileSdk to 35 for all modules
          echo "allprojects {" >> android/build.gradle
          echo "    tasks.matching { it.name.contains('AarMetadata') }.configureEach {" >> android/build.gradle
          echo "        enabled = false" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle
          echo "subprojects {" >> android/build.gradle
          echo "    afterEvaluate { project ->" >> android/build.gradle
          echo "        if (project.hasProperty('android')) {" >> android/build.gradle
          echo "            project.android {" >> android/build.gradle
          echo "                compileSdkVersion 35" >> android/build.gradle
          echo "            }" >> android/build.gradle
          echo "        }" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle

          # Enable core library desugaring for notification APIs
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/g' android/app/build.gradle
            sed -i 's/defaultConfig {/defaultConfig {\n        multiDexEnabled true/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle 2>/dev/null || true
            echo "" >> android/app/build.gradle
            echo "dependencies {" >> android/app/build.gradle
            echo '    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' >> android/app/build.gradle
            echo "}" >> android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/g' android/app/build.gradle.kts
            sed -i 's/defaultConfig {/defaultConfig {\n        multiDexEnabled = true/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle.kts 2>/dev/null || true
            sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle.kts 2>/dev/null || true
            echo "" >> android/app/build.gradle.kts
            echo "dependencies {" >> android/app/build.gradle.kts
            echo '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' >> android/app/build.gradle.kts
            echo "}" >> android/app/build.gradle.kts
          fi

          echo "=== Configured app build file ==="
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugins in pub-cache for Gradle compatibility
        run: |
          PUB_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "Scanning and patching plugin build.gradle files in $PUB_DIR..."
          find "$PUB_DIR" -type f -name "build.gradle" -exec sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 35/g' {} + || true
          find "$PUB_DIR" -type f -name "build.gradle" -exec sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 35/g' {} + || true
          find "$PUB_DIR" -type f -name "build.gradle" -exec sed -i 's/compileSdk = 34/compileSdk = 35/g' {} + || true
          find "$PUB_DIR" -type f -name "build.gradle" -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' {} + || true
          find "$PUB_DIR" -type f -name "build.gradle.kts" -exec sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 35/g' {} + || true
          find "$PUB_DIR" -type f -name "build.gradle.kts" -exec sed -i 's/compileSdk = 34/compileSdk = 35/g' {} + || true

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..
          mkdir -p build/app/outputs/flutter-apk
          find android/ -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/ \;
          echo "=== Built APK Artifacts ==="
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kheyrukum-apk
          path: build/app/outputs/flutter-apk/*.apk
