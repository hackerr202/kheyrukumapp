name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate clean modern Android scaffolding
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.kheyrukum.portal
          
          # Copy custom launcher icons into Android res folder
          if [ -d "android_res" ]; then
            cp -r android_res/* android/app/src/main/res/
          fi
          
          # Inject permissions, receivers & Firebase default notification channel metadata
          python scripts/patch_manifest.py android/app/src/main/AndroidManifest.xml

          # Configure Android Gradle (desugaring, minSdk 23, API 35, and optional google-services.json)
          python scripts/configure_firebase_android.py

          echo "=== Configured app build file ==="
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugins in pub-cache for Gradle compatibility
        run: |
          PUB_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          python scripts/patch_pub_cache.py "$PUB_DIR"

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon
          cd ..
          mkdir -p build/app/outputs/flutter-apk
          find android/ -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/ \;
          echo "=== Built APK Artifacts ==="
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kheyrukum-apk
          path: build/app/outputs/flutter-apk/*.apk
